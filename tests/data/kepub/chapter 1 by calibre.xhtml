<h1 class="title"><span class="koboSpan" id="kobo.2.1">Chapitre&#160;premier</span></h1>
<p><span class="koboSpan" id="kobo.3.1">Colin terminait sa toilette. </span><span class="koboSpan" id="kobo.3.2">Il s’était enveloppé, au sortir du bain, d’une ample serviette! </span><span class="koboSpan" id="kobo.3.3">Était-ce vrai? </span><span class="koboSpan" id="kobo.3.4">Oui.</span></p>
<p><span class="koboSpan" id="kobo.4.1">  Il avait vingt-deux ans, </span><em><span class="koboSpan" id="kobo.4.2">les cheveux blonds</span></em><span class="koboSpan" id="kobo.4.3"> et </span><a href="#n1" id="r1"><span class="koboSpan" id="kobo.4.4">des yeux</span></a><span class="koboSpan" id="kobo.4.5"> bleus. </span><span class="koboSpan" id="kobo.4.6">Mr. </span><span class="koboSpan" id="kobo.4.7">Smith arriva vers 3.5 h.</span></p>
<p><span class="koboSpan" id="kobo.5.1"><img src="../images/plate.png" alt="Planche"/></span><span class="koboSpan" id="kobo.5.2"> Sous l’image, un texte. </span><b><span class="koboSpan" id="kobo.5.3">Gras.</span></b><span class="koboSpan" id="kobo.5.4"> Et la suite&#160;!</span></p>
<div><p><span class="koboSpan" id="kobo.6.1">Un paragraphe dans une division.</span></p><span class="koboSpan" id="kobo.6.2">Texte libre après le paragraphe.</span></div>
<ul><li><span class="koboSpan" id="kobo.7.1">Un</span></li><li><span class="koboSpan" id="kobo.7.2">Deux </span><i><span class="koboSpan" id="kobo.7.3">et demi</span></i><span class="koboSpan" id="kobo.7.4">. </span><span class="koboSpan" id="kobo.7.5">Puis trois.</span></li></ul>
<table><tr><td><span class="koboSpan" id="kobo.8.1">Case un.</span></td><td><span class="koboSpan" id="kobo.8.2">Case deux.</span></td></tr></table>

  qui garde ses espaces.</pre>
