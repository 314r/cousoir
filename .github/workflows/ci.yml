# Builds Cousoir and runs its tests in an Arch Linux container, as on the
# computers it is made for. The comparison with Calibre (golden_list) skips
# itself without Calibre, and the performance budgets without
# COUSOIR_BENCH=1.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Root in a container: Chromium's sandbox cannot start.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Install the build's dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake git python \
            qt6-base qt6-declarative qt6-svg qt6-wayland qt6-webengine qt6-shadertools qt6-speech \
            sqlite libzip icu libstemmer xxhash libmtp poppler
      - uses: actions/checkout@v4
      - name: Build
        run: make build JOBS=4
      - name: Test
        run: tools/sandbox.sh ctest --test-dir build --output-on-failure
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
